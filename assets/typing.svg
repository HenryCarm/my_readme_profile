<!-- https://github.com/DenverCoder1/readme-typing-svg/ -->
<svg xmlns='http://www.w3.org/2000/svg'
    xmlns:xlink='http://www.w3.org/1999/xlink'
    viewBox='0 0 600 60'
    style='background-color: #0D111700;'
    width='600px' height='60px'>

    <style>
@font-face {
  font-family: 'JetBrains Mono';
  font-style: normal;
  font-weight: 400;
  font-display: fallback;
  src: url(data:font/truetype;base64,) format('truetype');
}
</style>

                <path id='path0'>
                            <!-- Multiline -->
                                <animate id='d0' attributeName='d' begin='0s;d2.end'
                    dur='4000ms' fill="freeze"
                    values='m0,20 h0 ; m0,20 h0 ; m0,20 h600 ; m0,20 h600' keyTimes='0;0;0.75;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#3FB950' font-size='15'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path0'>
            visitor@github:~$ cat profile.sh | bash
        </textPath>
    </text>
        <path id='path1'>
                            <!-- Multiline -->
                                <animate id='d1' attributeName='d' begin='0s;d2.end'
                    dur='8000ms' fill="freeze"
                    values='m0,40 h0 ; m0,40 h0 ; m0,40 h600 ; m0,40 h600' keyTimes='0;0.5;0.875;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#3FB950' font-size='15'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path1'>
            Python · Apps &amp; Scripts · Games 🎮1
        </textPath>
    </text>
        <path id='path2'>
                            <!-- Multiline -->
                                <animate id='d2' attributeName='d' begin='0s;d2.end'
                    dur='12000ms' fill="freeze"
                    values='m0,60 h0 ; m0,60 h0 ; m0,60 h600 ; m0,60 h600' keyTimes='0;0.66666666666667;0.91666666666667;1' />
                    </path>
    <text font-family='"JetBrains Mono", monospace' fill='#3FB950' font-size='15'
        dominant-baseline='middle'
        x='50%' text-anchor='middle'
        letter-spacing='normal'>
        <textPath xlink:href='#path2'>
            Linux Tinkerer · HenryCarm
        </textPath>
    </text>
</svg>
